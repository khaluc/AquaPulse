# Local services. Start with: docker compose up -d
# The Ollama container for Qwen3-VL is started separately (see README) because it
# already existed before this file; moving it here would collide on port 11434.
services:
  db:
    image: postgis/postgis:18-3.6
    container_name: aquapulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquapulse
      POSTGRES_USER: aquapulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquapulse-dev}
    ports:
      - "127.0.0.1:5432:5432"   # localhost only: this is a dev database
    volumes:
      - aquapulse-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquapulse -d aquapulse"]
      interval: 5s
      retries: 20

volumes:
  aquapulse-db:
